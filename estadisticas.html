<!DOCTYPE html>
<html lang="es" class="dk dk-base">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0c0e">
<meta name="robots" content="noindex, nofollow">
<title>Estadísticas · Ejercicios DJK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236a54b8'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3EDJK%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/DJK/ui/djk-ui.css?v=1">
<style>
/* Estadísticas de Ejercicios · aspecto común DJK (la base está en /DJK/ui/djk-ui.css) */
*{box-sizing:border-box}
html,body{margin:0}
.wrap{max-width:1000px;margin:0 auto;padding:1.4rem clamp(.8rem,2.4vw,1.6rem) 2.5rem}
h1{font-size:clamp(1.8rem,3.4vw,2.6rem);letter-spacing:-.015em;margin:.5rem 0 .3rem}
.sub{color:var(--dk-mute);margin:0 0 1rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;margin:1.2rem 0;background:var(--dk-line);border:1px solid var(--dk-line);border-radius:var(--dk-r);overflow:hidden;box-shadow:var(--dk-sombra)}
.kpi{background:var(--dk-s1);padding:.9rem 1.1rem 1rem}
.kpi small{display:block;font:500 .6rem/1.2 var(--dk-f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dk-mute)}
.kpi b{display:block;margin-top:.35rem;font:600 2.2rem/1 var(--dk-f-disp);font-variant-numeric:tabular-nums;color:var(--dk-ink)}
.kpi:first-child b{color:var(--dk-acc)}
.card{background:var(--dk-s1);border:1px solid var(--dk-line);border-radius:var(--dk-r);padding:1.15rem 1.25rem;margin:1rem 0;overflow-x:auto;box-shadow:var(--dk-sombra)}
.card h2{display:flex;align-items:center;gap:.6rem}
.card h2::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--dk-acc)}
td.num,th.num{white-space:nowrap}
.barra{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--dk-acc),color-mix(in srgb,var(--dk-acc) 55%,transparent));min-width:2px}
.vacio{color:var(--dk-faint)}
@media (max-width:600px){.wrap{padding:.8rem .7rem 2rem}table{font-size:.84rem}}
</style>
</head>
<body>
<header class="dk-top">
  <a class="dk-marca" href="/DJK/" aria-label="Panel DJK"><span class="dk-logo">DJK</span><span class="dk-sec">Ejercicios</span></a>
  <nav class="dk-nav" aria-label="Herramientas DJK">
    <a href="/DJK/"><svg class="ic" aria-hidden="true"><use href="/DJK/ui/iconos.svg#cuadricula"/></svg><span class="t">Panel</span></a>
    <a href="/DJK/api/abrir.php?app=apuntes"><svg class="ic" aria-hidden="true"><use href="/DJK/ui/iconos.svg#libro"/></svg><span class="t">Apuntes</span></a>
    <a href="/DJK/DJK_EjerciciosInteractivos/"><svg class="ic" aria-hidden="true"><use href="/DJK/ui/iconos.svg#tarea"/></svg><span class="t">Ejercicios</span></a>
    <a href="/DJK/api/abrir.php?app=examenes"><svg class="ic" aria-hidden="true"><use href="/DJK/ui/iconos.svg#examen"/></svg><span class="t">Exámenes</span></a>
  </nav>
</header>
<main class="wrap">
  <h1>Estadísticas de uso</h1>
  <p class="sub">Ejercicios Interactivos DJK · datos anónimos (sin nombres ni respuestas).</p>
  <div class="kpis">
    <div class="kpi"><small>Visitantes distintos</small><b id="kTotal">–</b></div>
    <div class="kpi"><small>Visitas totales</small><b id="kVistas">–</b></div>
    <div class="kpi"><small>Visitas últimos 7 días</small><b id="k7">–</b></div>
  </div>
  <section class="card"><h2>Por página</h2><table><thead><tr><th>Página</th><th class="num">Personas</th><th class="num">Visitas</th><th style="width:35%"></th></tr></thead><tbody id="tPag"><tr><td colspan="4" class="vacio">Cargando…</td></tr></tbody></table></section>
  <section class="card"><h2>Últimos 30 días</h2><table><thead><tr><th>Día</th><th class="num">Visitas</th><th style="width:55%"></th></tr></thead><tbody id="tDias"><tr><td colspan="3" class="vacio">Cargando…</td></tr></tbody></table></section>
</main>
<script>
const NOMBRES = {
  portada: 'Portada',
  UT1_E1: 'UT1 · E1 · Revoluciones industriales canarias', UT1_E2: 'UT1 · E2 · Combinación de sistemas ciberfísicos', UT1_E3: 'UT1 · E3 · Sistemas ciberfísicos',
  UT1_SP: 'Semipresencial · UT1 · Digitalización de los sectores productivos', UT2_SP: 'Semipresencial · UT2 · Tecnologías habilitadoras digitales', UT2_E1: 'UT2 · E1 · Parejas de tecnologías habilitadoras', UT2_E2: 'UT2 · E2 · Diseñad vuestro robot', UT2_E3: 'UT2 · E3 · Diseña tu app de realidad virtual o mixta', UT2_E4: 'UT2 · E4 · Tecnologías habilitadoras en tu centro'
};
const nombre = k => { const ej = /_ejemplo$/.test(k); const b = k.replace(/_ejemplo$/, ''); return (NOMBRES[b] || b) + (ej ? ' (ejemplo)' : ''); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n = v => Number(v).toLocaleString('es-ES');
fetch('api/visitas.php?estadisticas', { cache: 'no-store' }).then(r => r.json()).then(d => {
  if (!d.ok) throw new Error();
  const pags = d.paginas.map(p => ({ ...p, vistas: +p.vistas, personas: +p.personas })).sort((a, b) => b.vistas - a.vistas);
  const maxP = Math.max(1, ...pags.map(p => p.vistas));
  document.getElementById('kTotal').textContent = n(d.total);
  document.getElementById('kVistas').textContent = n(pags.reduce((s, p) => s + p.vistas, 0));
  const hace7 = new Date(Date.now() - 6 * 864e5).toISOString().slice(0, 10);
  document.getElementById('k7').textContent = n(d.dias.filter(x => x.dia >= hace7).reduce((s, x) => s + +x.vistas, 0));
  document.getElementById('tPag').innerHTML = pags.length ? pags.map(p => `<tr><td>${esc(nombre(p.pagina))}</td><td class="num">${n(p.personas)}</td><td class="num">${n(p.vistas)}</td><td><div class="barra" style="width:${p.vistas / maxP * 100}%"></div></td></tr>`).join('') : '<tr><td colspan="4" class="vacio">Todavía no hay visitas.</td></tr>';
  const maxD = Math.max(1, ...d.dias.map(x => +x.vistas));
  document.getElementById('tDias').innerHTML = d.dias.length ? d.dias.slice().reverse().map(x => `<tr><td>${new Date(x.dia + 'T12:00').toLocaleDateString('es-ES', { weekday: 'short', day: '2-digit', month: '2-digit' })}</td><td class="num">${n(x.vistas)}</td><td><div class="barra" style="width:${x.vistas / maxD * 100}%"></div></td></tr>`).join('') : '<tr><td colspan="3" class="vacio">Todavía no hay visitas.</td></tr>';
}).catch(() => {
  document.getElementById('tPag').innerHTML = '<tr><td colspan="4" class="vacio">No se han podido cargar las estadísticas.</td></tr>';
  document.getElementById('tDias').innerHTML = '<tr><td colspan="3" class="vacio">—</td></tr>';
});
</script>
</body>
</html>
